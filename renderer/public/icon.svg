<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBF24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="5" y="5" width="90" height="90" rx="20" fill="url(#mainGradient)" filter="url(#shadow)"/>
  <rect x="12" y="12" width="76" height="76" rx="16" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>

  <g transform="translate(50, 52)">
    <path d="M-30 16 Q0 28 30 16" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-20 4 Q0 24 20 4 Z" fill="rgba(255,255,255,0.95)"/>
    <line x1="0" y1="-20" x2="0" y2="4" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0 -14 L0 6 L17 -8" fill="none" stroke="url(#accentGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(72, 22)">
    <path d="M 0 -6 L 1.5 -2 L 6 -2 L 2.5 1 L 4 5.5 L 0 2.5 L -4 5.5 L -2.5 1 L -6 -2 L -1.5 -2 Z"
          fill="url(#accentGradient)"
          opacity="0.9"/>
  </g>

  <ellipse cx="50" cy="88" rx="30" ry="6" fill="rgba(255,255,255,0.1)"/>
</svg>
